name: Verify trainer
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: npm ci
      - run: uv sync --project apps/api --frozen --python 3.13
      - run: npm run lint && npm run typecheck && npm run test && npm run build
      - run: uv run --project apps/api ruff check --config apps/api/pyproject.toml apps/api content scripts
      - run: uv run --project apps/api python -m pytest apps/api/tests -q
      - run: uv run --project apps/api python scripts/validate_content.py
      - run: uv run --project apps/api python scripts/export_openapi.py && npm run api:types
      - run: git diff --exit-code apps/api/openapi.json apps/web/src/types/api.d.ts
      - run: uv run --project apps/api python scripts/check_security.py
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            artifacts/
            playwright-report/
            test-results/
