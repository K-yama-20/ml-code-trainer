[project]
name = "ml-trainer-api"
version = "1.0.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.129.0", "uvicorn==0.40.0", "sqlalchemy==2.0.46",
  "psycopg[binary]==3.3.2", "pydantic-settings==2.12.0",
  "pyjwt[crypto]==2.11.0", "httpx==0.28.1", "modal==1.3.2", "tzdata==2026.6"
]
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
[dependency-groups]
dev = ["pytest==9.0.2", "ruff==0.15.0", "numpy==2.4.2", "pandas==3.0.0", "scikit-learn==1.8.0", "torch==2.10.0"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
[tool.ruff.lint.per-file-ignores]
"../../scripts/*.py" = ["E402"]
